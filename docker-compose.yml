services:
  flask_app:
    build: .
    env_file:
      - .env
    ports:
      - "5050:5050"
    depends_on:
      - db
    volumes:
      - ./app:/app
    networks:
      - monitoring


  db:
    image: postgres:14
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - monitoring

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.0
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.0
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring

  fluentd:
    image: fluent/fluentd:v1.12-1
    env_file:
      - .env
    environment:
      - FLUENTD_ELASTICSEARCH_HOST=${FLUENTD_ELASTICSEARCH_HOST}
      - FLUENTD_ELASTICSEARCH_PORT=${FLUENTD_ELASTICSEARCH_PORT}
      - FLUENTD_ELASTICSEARCH_USER=${FLUENTD_ELASTICSEARCH_USER}
      - FLUENTD_ELASTICSEARCH_PASSWORD=${FLUENTD_ELASTICSEARCH_PASSWORD}
    volumes:
      - ./fluentd/conf:/fluentd/etc
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  pg_data:
  pgadmin_data:
  grafana-storage:
  es_data: