version: '3.8'

services:
  flask_app:
    build: .
    env_file:
      - .env
    ports:
      - "5050:5050"
    depends_on:
      - db
    volumes:
      - ./app:/app

  db:
    image: postgres:14
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_data:
  pgadmin_data: