events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        error_page 403 /403.html;

        location = /403.html {
            proxy_pass http://flask_app:5050/errors/403;
            internal;
        }

        # ── Kibana ────────────────────────────────────────────────────────────
        location /kibana/ {
            auth_request /auth/kibana;

            proxy_pass http://kibana:5601/kibana/;
            proxy_set_header Host kibana:5601;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Prometheus ────────────────────────────────────────────────────────
        location /prometheus/ {
            auth_request /auth/prometheus;

            proxy_pass http://prometheus:9090/prometheus/;
            proxy_set_header Host prometheus:9090;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Node Exporter ─────────────────────────────────────────────────────
        location /node-exporter/ {
            auth_request /auth/node-exporter;

            proxy_pass http://node-exporter:9100/;
            proxy_set_header Host node-exporter:9100;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Auth subrequest endpoints (forwarded to Flask) ────────────────────
        location = /auth/kibana {
            internal;
            proxy_pass http://flask_app:5050/proxy/auth/kibana;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host flask_app:5050;
        }

        location = /auth/prometheus {
            internal;
            proxy_pass http://flask_app:5050/proxy/auth/prometheus;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host flask_app:5050;
        }

        location = /auth/node-exporter {
            internal;
            proxy_pass http://flask_app:5050/proxy/auth/node-exporter;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host flask_app:5050;
        }

        # ── Deny everything else ──────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}