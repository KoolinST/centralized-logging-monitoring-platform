<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Confirmation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='check-box.css') }}">
</head>
<body>
  <div class="container">
    <div class="right-panel">
      <div class="form-box">
        <div class="check-icon">&#10004;</div>
        <h2>Check your inbox</h2>
        <p class="subtext">
          We’ve sent a password reset link to your email. Follow the instructions to set a new password.
        </p>
        <a href="{{ url_for('auth.login') }}" class="back-link">← Back to login</a>
      </div>
    </div>

    <div class="left-panel">
      <img src="{{ url_for('static', filename='images/pexels-rickyrecap-1964471.jpg') }}" alt="Reset Illustration" />
    </div>
  </div>
</body>
</html>
