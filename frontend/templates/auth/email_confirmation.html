<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Confirmation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='email_confirmation.css') }}">
</head>
<body>
  <div class="container">

    <div class="right-panel">
      <div class="form-box">
        <h2>Email Confirmation</h2>
        <p class="subtext">Please check your inbox for the confirmation email and follow the instructions to activate your account.</p>

        <div class="message-box">
          <p class="info-message">We've sent a confirmation email to <strong>{{ email }}</strong>. If you don't see it, check your spam folder or <a href="{{ url_for('auth.resend_confirmation', token = token) }}">request a new one</a>.</p>
        </div>

        <p class="login-link">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
      </div>
    </div>

    <div class="left-panel">
      <img src="{{ url_for('static', filename='images/pexels-rickyrecap-1964471.jpg') }}" alt="Confirmation Illustration" />
    </div>

  </div>
</body>
</html>
