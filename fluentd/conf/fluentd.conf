<source>
  @type tail
  tag flask.*
  path /var/log/containers/*flask*.log
  pos_file /fluentd/log/flask.log.pos
  format json
</source>

<match flask.*>
  @type elasticsearch
  host "#{ENV['FLUENTD_ELASTICSEARCH_HOST']}"
  port "#{ENV['FLUENTD_ELASTICSEARCH_PORT']}"
  logstash_format true
  flush_interval 1s
</match>